# 网络面板项目配置；保留运行入口、依赖版本与安全边界。
[package]
name = "wlmb-server"
version = "1.0.5"
edition = "2024"
rust-version = "1.85"
publish = false
authors = ["SlAlot"]
description = "Network Panel: independent bounded OpenWrt modem service core"
license-file = "../LICENSE"

[dependencies]
getrandom = "0.4"
regex = { version = "1.12", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"], optional = true }

[target.'cfg(unix)'.dependencies]
serialport = { version = "=4.10.1", default-features = false }
nix = { version = "0.26", default-features = false, features = ["term", "fs"] }
signal-hook = "0.3"

[features]
pushplus-https = ["dep:ureq"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.test]
debug = 0

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
