<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网络面板 fnOS 使用说明</title><body style="font:16px/1.8 system-ui;max-width:760px;margin:32px auto;padding:20px"><h1>网络面板 · fnOS</h1><p>从飞牛桌面打开网络面板，使用飞牛管理员账号验证。系统会识别模组并读取信号、当前小区、载波和邻区；未返回的数据显示为空。</p><p>当前版本提供参数查看。热点设置请使用设备自己的热点管理应用；网络面板不会接管 5G 拨号。串口被其他程序占用时会停止读取，不抢占端口。</p><p>应用的开启、关闭、升级和卸载统一在飞牛应用中心操作。后台采样仅在应用运行时执行。</p><p><a href="https://github.com/SlAlot/wlmb-server/tree/fnos">SlAlot · 项目源码</a></p></body></html>
