<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网络面板 · fnOS</title><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="fnos.css"><link rel="stylesheet" href="login.css"></head><body><main id="wlmb-panel" class="np-root auth-theme"><div id="auth-loading" class="np-auth-loading" role="status">正在连接…</div><div id="auth-view" class="np-auth-shell" hidden><div class="np-auth-stack"><section id="login" class="np-auth-card"><div class="np-auth-brand"><img class="np-auth-logo" src="./logo.png" alt="" width="46" height="46"><button type="button" class="np-auth-theme" data-auth-theme aria-label="切换外观">◐</button></div><h1>网络面板</h1><p class="np-auth-description">使用飞牛管理员账号登录</p><form id="login-form" class="np-auth-form"><label class="np-auth-field" for="username">管理员账号<input class="np-auth-input" id="username" name="username" autocomplete="username" placeholder="请输入管理员账号" required></label><label class="np-auth-field" for="password">密码<input class="np-auth-input" id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入管理员密码" required></label><div class="np-auth-options"><label class="np-auth-check"><input id="remember" type="checkbox">记住密码</label><label class="np-auth-check"><input id="auto-login" type="checkbox">自动登录</label></div><button type="submit" class="np-auth-submit">登录</button><p id="login-notice" class="np-auth-notice" role="status" aria-live="polite"></p></form></section><footer class="np-auth-footer">SlAlot</footer></div></div><div id="workspace" hidden></div></main><script src="webui-icons-1.1.3.js"></script><script src="webui-data-1.1.3.js"></script><script src="webui-shell-1.1.3.js"></script><script src="login.js"></script><script src="app.js"></script></body></html>
